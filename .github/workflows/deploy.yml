# Deploys one published version of @coderoot-eth/release-demo, only when CodeRoot answers verified
# for the exact bytes npm serves. Run it with the version to deploy; to move
# back, run it with the previous good version.

name: deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to deploy, e.g. 1.2.3"
        required: true

permissions: {}

concurrency:
  group: pages-rehearsal
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: ""
      - name: Fetch the published tarball
        id: tarball
        env:
          PACKAGE: "@coderoot-eth/release-demo"
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/release"
          npm pack "$PACKAGE@$VERSION" --pack-destination "$RUNNER_TEMP/release" --silent >/dev/null
          file="$(ls "$RUNNER_TEMP"/release/*.tgz)"
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "hash=sha256:$(sha256sum "$file" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: CodeRoot verify
        id: verify
        uses: coderoot-eth/action@v1
        with:
          mode: verify
          artifact: ${{ steps.tarball.outputs.file }}
          fail-open: "false"
          fail-on: unregistered
      - name: Require a complete verified result
        env:
          VERDICT: ${{ steps.verify.outputs.verdict }}
          DEGRADED: ${{ steps.verify.outputs.degraded }}
          EXIT_CODE: ${{ steps.verify.outputs.exit-code }}
        run: '[ "$VERDICT" = verified ] && [ "$DEGRADED" = false ] && [ "$EXIT_CODE" = 0 ]'
      - name: Build the demo from the verified tarball
        env:
          VERSION: ${{ inputs.version }}
          FILE: ${{ steps.tarball.outputs.file }}
          ARTIFACT_HASH: ${{ steps.tarball.outputs.hash }}
          SOURCE_RUN: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          export EXTRACTED_PACKAGE="$RUNNER_TEMP/extracted-package"
          export SITE_DIRECTORY="$RUNNER_TEMP/rehearsal-site"
          mkdir -p "$EXTRACTED_PACKAGE"
          tar -xzf "$FILE" -C "$EXTRACTED_PACKAGE" --strip-components=1 package/package.json package/index.js
          node .rehearsal/render-demo.mjs
      - name: Upload the verified site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/rehearsal-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the verified site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
